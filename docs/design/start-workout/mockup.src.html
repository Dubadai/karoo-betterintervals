<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start workout</title>
<style>
  @font-face { font-family: PlexCond; src: url(__FONT_COND__); font-weight: 500; }
  @font-face { font-family: PlexSemi; src: url(__FONT_SEMI__); font-weight: 600; }
  @font-face { font-family: PlexMed; src: url(__FONT_MED__); font-weight: 500; }
  :root { color-scheme: dark; }
  body { background:#2A2A2A; color:#E8E6E1; font:14px/1.45 -apple-system, "Helvetica Neue", Arial, sans-serif; margin:0; padding:28px 16px; }
  h1 { font-size:18px; font-weight:500; margin:0 0 4px; text-align:center; }
  p.d { color:#A9A6A0; margin:0 auto 22px; max-width:780px; text-align:center; }
  .devices { display:flex; flex-wrap:wrap; justify-content:center; gap:30px; margin-bottom:30px; }
  .dev { display:grid; justify-items:center; gap:8px; }
  .cap { color:#A9A6A0; font-size:13px; max-width:250px; text-align:center; }
</style>
</head>
<body>
<h1>Workout loaded, not started yet</h1>
<p class="d">Shown while the workout waits: before the ride and while you ride before starting it. The watts are live; the workout clock doesn't run until START (or the remote's pause button). Karoo style, W7.1 Stair Climb, first step 19 min @ 115 W.</p>
<div class="devices" id="light"></div>
<div class="devices" id="dark"></div>

<script>/*__KAROO_DEVICE_JS__*/</script>
<script>
const FRAME = "__FRAME__";
const SHOTS = { light: "__SHOT_light__", dark: "__SHOT_dark__" };
const C = {
  light: { bg: '#FFFFFF', ink: '#0B0B0B', sub: '#444441', track: '#EBEBEB', heart: '#C62F3A', green: '#129A5E' },
  dark:  { bg: '#000000', ink: '#FFFFFF', sub: '#D3D1C7', track: '#1F1F1F', heart: '#FF5C66', green: '#1DB872' },
};
const YELLOW = '#FFE900', YELLOW_INK = '#0B0B0B';

// Chart in the Karoo zone colours, as built (see ../karoo-zone-colours/): recolour the screenshot's chart.
const NOW = {
  light: { z: ['#1D9E75', '#639922', '#BA7517', '#D85A30', '#E24B4A'], done: '#888780' },
  dark:  { z: ['#1D9E75', '#639922', '#EF9F27', '#D85A30', '#E24B4A'], done: '#888780' },
};
const KAROO = {
  light: ['#8F8D86', '#2F7FD8', '#3FA34D', '#E8B400', '#F07A1A', '#E0383E', '#8B4FD8'],
  dark:  ['#A6A49C', '#4C9BF0', '#5CC46A', '#FFD02E', '#FF9440', '#FF5A5F', '#A97AF2'],
};
const DONE_STEPS = [[16, 64, 0], [65, 87, 2]];
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function recolour(d, pairs, bgHex, y0) {
  const bg = hex(bgHex), P = pairs.map(([f, t, x0 = 0, x1 = 479]) => [hex(f), hex(t), x0, x1]);
  for (let i = y0 * 480 * 4; i < d.length; i += 4) {
    const p = [d[i], d[i + 1], d[i + 2]], x = (i / 4) % 480;
    for (const [f, t, x0, x1] of P) {
      if (x < x0 || x > x1) continue;
      const v = f.map((c, k) => c - bg[k]), len2 = v.reduce((s, c) => s + c * c, 0);
      if (!len2) continue;
      const a = p.reduce((s, c, k) => s + (c - bg[k]) * v[k], 0) / len2;
      if (a < 0.2 || a > 1.05) continue;
      const res = p.reduce((s, c, k) => s + Math.abs(c - (bg[k] + a * v[k])), 0);
      if (res > 18) continue;
      for (let k = 0; k < 3; k++) d[i + k] = Math.round(bg[k] + Math.min(a, 1) * (t[k] - bg[k]));
      break;
    }
  }
}

function heart(ctx, x, y, s, color) {        // Tabler heart in a 24-unit box, top-left at x, y
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 24, s / 24);
  ctx.fillStyle = color; ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineJoin = 'round';
  const p = new Path2D('M19.5,12.572L12,20l-7.5,-7.428A5,5 0,1 1,12 6.006a5,5 0,1 1,7.5 6.572');
  ctx.fill(p); ctx.stroke(p); ctx.restore();
}
function play(ctx, cx, cy, h, color) {
  ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(cx - h * 0.4, cy - h / 2); ctx.lineTo(cx + h * 0.5, cy); ctx.lineTo(cx - h * 0.4, cy + h / 2); ctx.closePath(); ctx.fill();
}
function text(ctx, s, x, y, font, color, align = 'left') { ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.fillText(s, x, y); }

function ready(theme, layout) {
  return ctx => {
    const c = C[theme], snap = ctx.getImageData(0, 0, 480, 800);
    // chart: Karoo zone colours, nothing done yet, no "now" marker or current-step outline
    const chart = new ImageData(new Uint8ClampedArray(snap.data), 480, 800);
    const n = NOW[theme], k = KAROO[theme];
    recolour(chart.data, [...n.z.map((z, i) => [z, k[i]]), ...DONE_STEPS.map(([x0, x1, z]) => [n.done, k[z], x0, x1])], c.bg, 664);
    ctx.fillStyle = c.bg; ctx.fillRect(0, 64, 480, 736);
    ctx.putImageData(chart, 0, 0, 0, 664, 480, 136);
    ctx.fillStyle = c.bg; ctx.fillRect(0, 664, 480, 40);          // marker ▼ and line
    ctx.fillRect(86, 703, 32, 48); ctx.fillStyle = k[4]; ctx.fillRect(88.5, 708, 26, 42);   // current step, plain
    ctx.putImageData(snap, 0, 0, 0, 70, 66, 56);                  // gear
    // Next up box → First up (the box and its ⏮ ⏭ from the screenshot)
    ctx.putImageData(snap, 0, 0, 0, 570, 480, 98);
    ctx.fillStyle = c.bg; ctx.fillRect(100, 580, 280, 78);
    text(ctx, 'FIRST UP', 240, 606, '500 24px PlexCond', c.sub, 'center');
    text(ctx, '19m @ 115W', 240, 646, '600 33px PlexSemi', c.ink, 'center');
    // top row: heart rate (no pause button: nothing runs yet)
    heart(ctx, 188, 82, 32, c.heart);
    text(ctx, '123', 230, 112, '600 38px PlexSemi', c.ink);

    const button = (x, y, w, h, r, big) => {
      ctx.fillStyle = YELLOW; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill();
      if (big) {
        play(ctx, x + w / 2, y + h * 0.36, 46, YELLOW_INK);
        text(ctx, 'START WORKOUT', x + w / 2, y + h * 0.80, '500 44px PlexCond', YELLOW_INK, 'center');
      } else {
        ctx.font = '500 38px PlexCond';
        const tw = ctx.measureText('START WORKOUT').width, gap = 16, iw = 26, total = iw + gap + tw;
        const x0 = x + (w - total) / 2;
        play(ctx, x0 + iw / 2, y + h / 2, 30, YELLOW_INK);
        text(ctx, 'START WORKOUT', x0 + iw + gap, y + h / 2 + 13, '500 38px PlexCond', YELLOW_INK);
      }
    };
    const nameRow = y => {
      text(ctx, 'W7.1 · STAIR CLIMB', 16, y, '500 28px PlexCond', c.ink);
      text(ctx, '2:00:00', 464, y + 2, '600 40px PlexSemi', c.ink, 'right');
    };

    if (layout === 'A') {
      text(ctx, '142', 240, 345, '500 236px PlexMed', c.ink, 'center');       // live watts, as now
      nameRow(424);
      ctx.fillStyle = c.track; ctx.beginPath(); ctx.roundRect(16, 441, 448, 11, 5.5); ctx.fill();
      button(16, 461, 448, 101, 15, false);                                   // where the tiles are
    } else {
      text(ctx, '142', 240, 262, '500 150px PlexMed', c.ink, 'center');       // watts smaller
      button(16, 290, 448, 180, 22, true);                                    // big, in the middle
      nameRow(530);
    }
  };
}

const VARIANTS = [
  ['A · Same screen, START WORKOUT where the tiles are (watts stay big)', 'A'],
  ['B · Big START WORKOUT in the middle, smaller watts', 'B'],
];

(async () => {
  await Promise.all(['500 20px PlexCond', '600 20px PlexSemi', '500 20px PlexMed'].map(f => document.fonts.load(f)));
  for (const t of ['light', 'dark']) {
    const dev = await KarooDevice.load({ frame: FRAME, screen: SHOTS[t] });
    for (const [cap, layout] of VARIANTS) {
      const scr = dev.screen({ draw: ready(t, layout) });
      const el = document.createElement('div'); el.className = 'dev'; el.append(dev.device(scr, 250));
      const c = document.createElement('div'); c.className = 'cap'; c.textContent = `${cap} (${t})`; el.append(c);
      document.getElementById(t).append(el);
    }
  }
})();
</script>
</body>
</html>
