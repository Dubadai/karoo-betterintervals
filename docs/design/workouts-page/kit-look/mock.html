<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Workouts page mock</title>
<!-- BetterIntervals' Workouts page in the settings kit's look. One Karoo screen (480 x 800 px =
     256 x 427 dp at 1.875) per #shot=<state>-<light|dark>; shots.sh renders them with Chrome. -->
<style>
@font-face { font-family: Plex; src: url(../../../../../design-assets/fonts/IBMPlexSans-Regular.ttf); font-weight: 400; }
@font-face { font-family: Plex; src: url(../../../../../design-assets/fonts/IBMPlexSans-Medium.ttf); font-weight: 500; }
@font-face { font-family: Plex; src: url(../../../../../design-assets/fonts/IBMPlexSans-SemiBold.ttf); font-weight: 600; }
@font-face { font-family: Plex; src: url(../../../../../design-assets/fonts/IBMPlexSans-Bold.ttf); font-weight: 700; }
:root {            /* the settings kit's colours (values/colors.xml) */
  --bg: #FFFFFF; --title: #1C2E2E; --help: #6F6F6F; --divider: #DDDDDD; --track: #F4F4F4;
  --selected: #3E5560; --add-bg: #C5D3DA; --add-text: #111111; --remove: #D0342C;
  --ok: #2E9E4F; --warn: #B26A00; --main: #FFE600;
  --on-selected: #FFFFFF; --remove-tonal: #FBE4E2; --select-blue: #007AFF; --select-tint: #E8F2FF;
}
.dark {            /* values-night */
  --bg: #000000; --title: #F2F2F2; --help: #B4B2A9; --divider: #3A3A38; --track: #2A2A2A;
  --selected: #C5D3DA; --add-bg: #34444C; --add-text: #F2F2F2; --remove: #FF6B5E;
  --ok: #4CC777; --warn: #F0A63A;
  --on-selected: #0B0B0B; --remove-tonal: #3D1F1C; --select-blue: #0A84FF; --select-tint: #0F2440;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 256px; height: 427px; overflow: hidden; font-family: Plex, sans-serif; }
.screen { width: 256px; height: 427px; background: var(--bg); color: var(--title); overflow: hidden; position: relative; }
.status { height: 24.5px; background-size: 256px 24.5px; position: relative; z-index: 2; }
.light .status { background-image: url(parts/status-light.png); }
.dark .status { background-image: url(parts/status-dark.png); }
.page { padding: 0 12px; }
.page.scrolled { margin-top: var(--scroll); }

.head { display: flex; align-items: center; height: 52px; }
.head h1 { flex: 1; font-size: 22px; font-weight: 700; }
.icon { width: 20px; height: 20px; flex: none; stroke: var(--title); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.head .icon { width: 24px; height: 24px; margin-right: 6px; }

.buttons { display: flex; gap: 8px; }
.btn { height: 48px; border-radius: 28px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; }
.btn.main { flex: 1; background: var(--main); color: #111; }
.btn.add { width: 96px; background: var(--add-bg); color: var(--add-text); }

.sync { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--help); padding: 16px 2px 8px; }
.sync .warn { color: var(--selected); font-weight: 600; }
.sync .link { margin-left: auto; font-weight: 600; color: var(--on-selected); background: var(--selected); border-radius: 16px; padding: 5px 12px; }

.heading { display: flex; align-items: center; padding: 14px 0 10px; font-size: 18px; }
.heading .icon { margin-right: 8px; }
.divider { height: 1px; background: var(--divider); margin-top: 6px; }

.day { font-size: 14px; color: var(--help); padding: 4px 2px 6px; }
.day.today { color: var(--title); font-weight: 600; }

.card { background: var(--track); border-radius: 20px; padding: 10px 12px 10px; margin-bottom: 8px; }
.card .top { display: flex; align-items: flex-start; gap: 8px; }
.card .name { flex: 1; font-size: 16px; font-weight: 600; line-height: 1.25; }
.tag { font-size: 10px; font-weight: 600; border-radius: 9px; padding: 2px 6px; margin-top: 2px; white-space: nowrap; }
.tag.today { color: var(--selected); border: 1.5px solid var(--selected); }
.tag.loaded { color: #FFFFFF; background: var(--select-blue); border: 1.5px solid var(--select-blue); }
.tag.ridden { color: var(--help); border: 1px solid var(--help); }
.chart { display: block; width: 100%; height: 34px; margin-top: 8px; }
.card .meta { font-size: 13px; color: var(--help); margin-top: 6px; }
.card.loaded { outline: 3px solid var(--select-blue); outline-offset: 2px; margin: 5px 0 13px; background: var(--select-tint); }
.card.ridden { opacity: 0.6; }

.scale { display: flex; align-items: center; gap: 8px; background: var(--track); border-radius: 28px; padding: 6px; }
.scale .label { flex: 1; font-size: 13px; color: var(--help); }
.step { width: 48px; height: 40px; border-radius: 20px; background: var(--selected); color: var(--on-selected); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 500; }
.scale .pct { flex: 1; text-align: center; font-size: 20px; font-weight: 500; }
.remove { height: 48px; border-radius: 28px; margin-top: 8px; display: flex; align-items: center; justify-content: center; background: var(--remove-tonal); color: var(--remove); font-size: 15px; font-weight: 600; }
.help { font-size: 13px; color: var(--help); padding: 8px 0 4px; }
</style>
</head>
<body>
<div id="screen" class="screen"><div class="status"></div><div class="page" id="page"></div></div>
<script>
const ICON = {
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  play: '<circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l5.5-3.5z"/>',
  bolt: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  week: '<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
};
const icon = (k, cls = 'icon') => `<svg class="${cls}" viewBox="0 0 24 24">${ICON[k]}</svg>`;

// Workout profiles: [length, kind] with kind w = warm-up/cool-down grey, e endurance blue,
// t tempo green, s sweet spot yellow; heights as on the card chart.
const H = { w: 0.45, e: 0.55, t: 0.95, s: 1.0 };
const C = { w: '#A39E99', e: '#4C9BE8', t: '#5BC46E', s: '#F5D33A' };
function chart(steps) {
  const total = steps.reduce((a, [l]) => a + l, 0);
  let x = 0, out = '';
  for (const [l, k] of steps) {
    const w = l / total * 232, h = H[k] * 34;
    out += `<rect x="${x.toFixed(2)}" y="${(34 - h).toFixed(2)}" width="${(w - 0.8).toFixed(2)}" height="${h.toFixed(2)}" fill="${C[k]}"/>`;
    x += w;
  }
  return `<svg class="chart" viewBox="0 0 232 34" preserveAspectRatio="none">${out}</svg>`;
}
const SWEET = [[10,'w'],[15,'e'],[20,'s'],[5,'e'],[20,'s'],[15,'e'],[10,'w']];
const TEMPO = [[10,'w'],[20,'e'],[15,'t'],[4,'e'],[15,'t'],[4,'e'],[15,'t'],[4,'e'],[30,'e']];
const STAIRS = [[8,'w'],[25,'e'],[4,'t'],[4,'t'],[4,'s'],[8,'w'],[4,'t'],[4,'t'],[4,'s'],[8,'w'],[4,'t'],[4,'t'],[4,'s'],[8,'w'],[20,'e'],[8,'w']];
const ENDUR = [[10,'w'],[100,'e'],[10,'w']];

function card(name, steps, meta, tag, extra = '') {
  const cls = tag === 'loaded' ? 'card loaded' : tag === 'ridden' ? 'card ridden' : 'card';
  const label = { ridden: 'RIDDEN' }[tag];   // the ring marks the loaded one, the day heading says Today
  return `<div class="${cls}"><div class="top"><div class="name">${name}</div>${label ? `<span class="tag ${tag}">${label}</span>` : ''}</div>${chart(steps)}<div class="meta">${meta}</div>${extra}</div>`;
}
const head = `<div class="head"><h1>Workouts</h1>${icon('gear')}</div>
  <div class="buttons"><div class="btn main">Back to ride</div><div class="btn add">Sync</div></div>`;

const STATES = {
  // Nothing loaded, Wi-Fi off: one status line instead of a paragraph and a button
  wifi: () => `${head}
    <div class="sync"><span>Synced 12:33</span><span>·</span><span class="warn">Wi-Fi off</span><span class="link">Turn on</span></div>
    <div style="height:6px"></div>
    <div class="day today">Today · Mon 9 Nov</div>
    ${card('W2.3 - Sweet spot 2 x 20', SWEET, '1:35:00', 'today')}
    <div class="day">Fri 13 Nov</div>
    ${card('W3.1 - Tempo 3 x 15', TEMPO, '2:20:00')}`,
  // A workout loaded: Scale, then Current workout with Remove under its card
  loaded: () => `${head}
    <div class="sync"><span>Synced 12:33</span></div>
    <div class="heading">${icon('bolt')}Scale workout</div>
    <div class="scale"><div class="step">−</div><div class="pct">100%</div><div class="step">+</div></div>
    <div class="help">Power targets in % of the plan.</div>
    <div class="divider"></div>
    <div class="heading">${icon('play')}Current workout</div>
    ${card('W2.3 - Sweet spot 2 x 20', SWEET, '1:35:00 · Today', 'loaded')}
    <div class="remove">Remove workout</div>`,
  // Scrolled a little: the whole current workout and its Remove button, then the week without it
  // (the loaded workout isn't listed twice; a day with nothing else left has no heading)
  current: () => `<div style="margin-top:-40px">
    <div class="help">Power targets in % of the plan.</div>
    <div class="divider"></div>
    <div class="heading">${icon('play')}Current workout</div>
    ${card('W2.3 - Sweet spot 2 x 20', SWEET, '1:35:00 · Today', 'loaded')}
    <div class="remove">Remove workout</div>
    <div class="divider" style="margin:12px 0 12px"></div>
    <div class="day">Fri 13 Nov</div>
    ${card('W3.1 - Tempo 3 x 15', TEMPO, '2:20:00')}</div>`,
  // Scrolled down: Remove, then the rest of the week (coming days, then days ridden)
  week: () => `<div style="margin-top:-10px"><div class="remove">Remove workout</div></div>
    <div class="divider" style="margin:12px 0 12px"></div>
    <div class="day">Fri 13 Nov</div>
    ${card('W3.1 - Tempo 3 x 15', TEMPO, '2:20:00')}
    <div class="day">Sat 14 Nov</div>
    ${card('W7.1 - Stair Climb 80-->100%', STAIRS, '2:30:00')}
    <div class="day">Sun 8 Nov</div>
    ${card('W1.7 - Endurance', ENDUR, '2:00:00', 'ridden')}`,
};
const [state, mode] = (location.hash.match(/shot=([a-z]+)-(light|dark)/) || [, 'wifi', 'light']).slice(1);
document.getElementById('screen').classList.add(mode);
document.getElementById('page').innerHTML = STATES[state]();
</script>
</body>
</html>
