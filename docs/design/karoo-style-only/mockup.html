<h1>Settings without the Karoo style switch</h1>
<p class="d">Karoo style is always on, so its row goes: Appearance is followed straight by Tiles. The introduction's "Look" page loses the same Off / On row and keeps Appearance. Emulator shots.</p>

<script>/*
 * Karoo 3 device mockups for design reviews (any Karoo app).
 *
 * Draws a real device screenshot (480×800) inside the Karoo 3 frame, lets you redraw just the
 * part that changes, and can paste parts of the screenshot back on top (e.g. the Karoo's own
 * buttons that float over a field).
 *
 *   const dev = await KarooDevice.load({ frame: FRAME_PNG_URL, screen: SCREENSHOT_URL });
 *   const scr = dev.screen({
 *     draw(ctx) { ... },                           // draw in screen px (480×800), over the screenshot
 *     keepOnTop: [ctx => ctx.roundRect(-50, 683, 150, 100, 50)],  // screenshot areas to restore
 *   });
 *   document.body.append(dev.device(scr, 320));     // whole device, 320 CSS px wide
 *   document.body.append(dev.crop(scr, [0, 635, 238, 142], 2));  // one field, 2× zoom
 *
 * Frame geometry comes from karoo-3-frame.json (unit 1100×1800, screen rect inside it).
 * Mockup pages are opened as static snapshots, so pass images as data: URLs (see a project's
 * docs/design/<feature>/build.py for the inlining step).
 */
const KarooDevice = (() => {
  const FRAME = { unitW: 1100, unitH: 1800, screenX: 177, screenY: 215, screenW: 745, screenH: 1232, screenR: 28 };
  const SCREEN_W = 480, SCREEN_H = 800;

  const img = src => new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = fail; i.src = src; });

  async function load({ frame, screen: screenSrc }) {
    const [frameImg, screenImg] = await Promise.all([img(frame), img(screenSrc)]);
    /** The screen alone (480×800 px): screenshot, your drawing, then the bits kept on top. */
    function screen({ draw, keepOnTop = [], scale = 1 } = {}) {
      const c = document.createElement('canvas');
      c.width = SCREEN_W * scale; c.height = SCREEN_H * scale;
      const ctx = c.getContext('2d');
      ctx.scale(scale, scale);
      ctx.drawImage(screenImg, 0, 0, SCREEN_W, SCREEN_H);
      if (draw) { ctx.save(); draw(ctx); ctx.restore(); }
      for (const shape of keepOnTop) {
        ctx.save(); ctx.beginPath(); shape(ctx); ctx.clip();
        ctx.drawImage(screenImg, 0, 0, SCREEN_W, SCREEN_H);
        ctx.restore();
      }
      return c;
    }

    /** The whole device: [screenCanvas] (from screen()) inside the Karoo 3 frame, [width] CSS px wide. */
    function device(screenCanvas, width = 320) {
      const dpr = window.devicePixelRatio || 1;
      const k = width / FRAME.unitW;
      const c = document.createElement('canvas');
      c.width = Math.round(FRAME.unitW * k * dpr);
      c.height = Math.round(FRAME.unitH * k * dpr);
      c.style.width = `${width}px`;
      c.style.height = `${Math.round(FRAME.unitH * k)}px`;
      const ctx = c.getContext('2d');
      ctx.scale(k * dpr, k * dpr);
      // The frame image has its own (dark) glass, so the screen goes on top of it.
      ctx.drawImage(frameImg, 0, 0, FRAME.unitW, FRAME.unitH);
      ctx.save();
      ctx.beginPath();
      ctx.roundRect(FRAME.screenX, FRAME.screenY, FRAME.screenW, FRAME.screenH, FRAME.screenR);
      ctx.clip();
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(screenCanvas, FRAME.screenX, FRAME.screenY, FRAME.screenW, FRAME.screenH);
      ctx.restore();
      return c;
    }

    /** A zoomed crop of the screen (e.g. one field): rect in screen px, [zoom]× size. */
    function crop(screenCanvas, [x, y, w, h], zoom = 2) {
      const c = document.createElement('canvas');
      const s = screenCanvas.width / SCREEN_W;
      c.width = w * zoom; c.height = h * zoom;
      const ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(screenCanvas, x * s, y * s, w * s, h * s, 0, 0, w * zoom, h * zoom);
      return c;
    }

    return { screen, device, crop };
  }
  return { load, SCREEN_W, SCREEN_H };
})();
</script>

// Karoo style section in shot 1 (divider above → divider below), and how far shot 2 is scrolled past shot 1
const CUT = { light: [351, 625, 491], dark: [352, 627, 494] };
const img = src => new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.src = src; });
function without(theme, a, b) {
  const [top, bottom, scroll] = CUT[theme];
  return ctx => {
    ctx.drawImage(a, 0, 0);
    // everything below the removed section moves up: take it from the second shot
    const from = bottom - scroll;
    ctx.drawImage(b, 0, from, 480, 755 - from, 0, top, 480, 755 - from);
    ctx.drawImage(a, 0, 0, 480, 150, 0, 0, 480, 150);      // header stays on top
    ctx.drawImage(a, 0, 755, 480, 45, 0, 755, 480, 45);    // nav bar
  };
}
(async () => {
  const rows = [['Now', 'now'], ['Karoo style always on', 'after']];
  const shots = {}, devs = {};
  for (const t of ['light', 'dark']) {
    shots[t] = [await img(SHOT[t][0]), await img(SHOT[t][1])];
    devs[t] = await KarooDevice.load({ frame: FRAME, screen: SHOT[t][0] });
  }
  for (const [cap, kind] of rows) {
    const row = document.createElement('div'); row.className = 'devices';
    for (const t of ['light', 'dark']) {
      const scr = devs[t].screen({ draw: kind === 'now' ? null : without(t, ...shots[t]), scale: 2 });
      const el = document.createElement('div'); el.className = 'dev'; el.append(devs[t].device(scr, 380));
      const c = document.createElement('div'); c.className = 'cap'; c.textContent = `${cap} (${t})`; el.append(c);
      row.append(el);
    }
    document.getElementById('rows').append(row);
  }
})();
