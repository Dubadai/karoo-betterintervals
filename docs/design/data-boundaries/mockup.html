<h1>BetterIntervals with data field boundaries on: round 2</h1>
<p class="d">Drawn on Karoo 3 screenshots (gauge screen). The Karoo's grey is an estimate until it's measured on the device.</p>
<div class="devices" id="light"></div>
<div class="devices" id="dark"></div>
<div class="devices" id="zoom"></div>

<script>/*
 * Karoo 3 device mockups for design reviews (any Karoo app).
 *
 * Draws a real device screenshot (480×800) inside the Karoo 3 frame, lets you redraw just the
 * part that changes, and can paste parts of the screenshot back on top (e.g. the Karoo's own
 * buttons that float over a field).
 *
 *   const dev = await KarooDevice.load({ frame: FRAME_PNG_URL, screen: SCREENSHOT_URL });
 *   const scr = dev.screen({
 *     draw(ctx) { ... },                           // draw in screen px (480×800), over the screenshot
 *     keepOnTop: [ctx => ctx.roundRect(-50, 683, 150, 100, 50)],  // screenshot areas to restore
 *   });
 *   document.body.append(dev.device(scr, 320));     // whole device, 320 CSS px wide
 *   document.body.append(dev.crop(scr, [0, 635, 238, 142], 2));  // one field, 2× zoom
 *
 * Frame geometry comes from karoo-3-frame.json (unit 1100×1800, screen rect inside it).
 * Mockup pages are opened as static snapshots, so pass images as data: URLs (see a project's
 * docs/design/<feature>/build.py for the inlining step).
 */
const KarooDevice = (() => {
  const FRAME = { unitW: 1100, unitH: 1800, screenX: 177, screenY: 215, screenW: 745, screenH: 1232, screenR: 28 };
  const SCREEN_W = 480, SCREEN_H = 800;

  const img = src => new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = fail; i.src = src; });

  async function load({ frame, screen: screenSrc }) {
    const [frameImg, screenImg] = await Promise.all([img(frame), img(screenSrc)]);
    /** The screen alone (480×800 px): screenshot, your drawing, then the bits kept on top. */
    function screen({ draw, keepOnTop = [], scale = 1 } = {}) {
      const c = document.createElement('canvas');
      c.width = SCREEN_W * scale; c.height = SCREEN_H * scale;
      const ctx = c.getContext('2d');
      ctx.scale(scale, scale);
      ctx.drawImage(screenImg, 0, 0, SCREEN_W, SCREEN_H);
      if (draw) { ctx.save(); draw(ctx); ctx.restore(); }
      for (const shape of keepOnTop) {
        ctx.save(); ctx.beginPath(); shape(ctx); ctx.clip();
        ctx.drawImage(screenImg, 0, 0, SCREEN_W, SCREEN_H);
        ctx.restore();
      }
      return c;
    }

    /** The whole device: [screenCanvas] (from screen()) inside the Karoo 3 frame, [width] CSS px wide. */
    function device(screenCanvas, width = 320) {
      const dpr = window.devicePixelRatio || 1;
      const k = width / FRAME.unitW;
      const c = document.createElement('canvas');
      c.width = Math.round(FRAME.unitW * k * dpr);
      c.height = Math.round(FRAME.unitH * k * dpr);
      c.style.width = `${width}px`;
      c.style.height = `${Math.round(FRAME.unitH * k)}px`;
      const ctx = c.getContext('2d');
      ctx.scale(k * dpr, k * dpr);
      // The frame image has its own (dark) glass, so the screen goes on top of it.
      ctx.drawImage(frameImg, 0, 0, FRAME.unitW, FRAME.unitH);
      ctx.save();
      ctx.beginPath();
      ctx.roundRect(FRAME.screenX, FRAME.screenY, FRAME.screenW, FRAME.screenH, FRAME.screenR);
      ctx.clip();
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(screenCanvas, FRAME.screenX, FRAME.screenY, FRAME.screenW, FRAME.screenH);
      ctx.restore();
      return c;
    }

    /** A zoomed crop of the screen (e.g. one field): rect in screen px, [zoom]× size. */
    function crop(screenCanvas, [x, y, w, h], zoom = 2) {
      const c = document.createElement('canvas');
      const s = screenCanvas.width / SCREEN_W;
      c.width = w * zoom; c.height = h * zoom;
      const ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(screenCanvas, x * s, y * s, w * s, h * s, 0, 0, w * zoom, h * zoom);
      return c;
    }

    return { screen, device, crop };
  }
  return { load, SCREEN_W, SCREEN_H };
})();
</script>

// Measured on the screenshots (px, 480×800): field starts at y≈64; tiles 16–234 / 246–464 × 461–562;
// Next up box 16–464 × 574–664 with a 2 px outline; corners ≈15 px (8dp). Tile fill 235 (light) / 31 (dark).
const FIELD_TOP = 64;
const TILES = [[16, 461, 218, 101], [246, 461, 218, 101]];
const NEXT = [16, 574, 448, 90];
const R = 15;
// Estimated Karoo colours with boundaries on (to be measured on the device).
const KAROO = {
  light: { bg: 255, tile: 235, page: 230, tileA: 214, card: 255 },
  dark:  { bg: 0,   tile: 31,  page: 28,  tileA: 54,  card: 0 },
};

const rr = ([x, y, w, h], r = R) => { const p = new Path2D(); p.roundRect(x, y, w, h, r); return p; };
const inset = ([x, y, w, h], d) => [x + d, y + d, w - 2 * d, h - 2 * d];

/** Repaint the field as if its surfaces had other colours, keeping text and icons.
 *  Light: ink is dark, so scale towards the new surface. Dark: ink is light, so scale from white. */
function resurface(theme, { status, page, tile, nextFill, dropOutline }) {
  return ctx => {
    const k = KAROO[theme], img = ctx.getImageData(0, 0, 480, 800), d = img.data;
    const tiles = TILES.map(t => rr(t)), nextOuter = rr(NEXT), nextInner = rr(inset(NEXT, 3), R - 3);
    const remap = (v, from, to) => theme === 'light'
      ? Math.min(255, v * to / from)
      : Math.max(0, 255 - (255 - v) * (255 - to) / (255 - from));
    for (let y = 0; y < 800; y++) for (let x = 0; x < 480; x++) {
      const i = (y * 480 + x) * 4, r = d[i], g = d[i + 1], b = d[i + 2];
      let from = k.bg, to = y < FIELD_TOP ? status : page;
      if (y >= FIELD_TOP) {
        if (tiles.some(p => ctx.isPointInPath(p, x + .5, y + .5))) { from = k.tile; to = tile; }
        else if (ctx.isPointInPath(nextOuter, x + .5, y + .5)) {
          const inner = ctx.isPointInPath(nextInner, x + .5, y + .5);
          if (!inner && dropOutline) { d[i] = d[i + 1] = d[i + 2] = nextFill; continue; }
          if (inner) to = nextFill;
        }
      }
      if (from === to) continue;
      if (Math.max(r, g, b) - Math.min(r, g, b) > 24) continue;   // keep coloured marks (gauge, chart, icons) as they are
      d[i] = remap(r, from, to); d[i + 1] = remap(g, from, to); d[i + 2] = remap(b, from, to);
    }
    ctx.putImageData(img, 0, 0);
  };
}

const VARIANTS = theme => {
  const k = KAROO[theme];
  return [
    ['Now: a white card on the Karoo grey', { status: k.page, page: k.bg, tile: k.tile, nextFill: k.bg }],
    ['Chosen: white tile cards, Next up keeps only its border', { status: k.page, page: k.page, tile: k.card, nextFill: k.page }],
  ];
};

(async () => {
  for (const t of ['light', 'dark']) {
    const dev = await KarooDevice.load({ frame: FRAME, screen: SHOTS[t] });
    const row = document.getElementById(t);
    for (const [cap, opts] of VARIANTS(t)) {
      const scr = dev.screen({ draw: resurface(t, opts) });
      const el = document.createElement('div'); el.className = 'dev'; el.append(dev.device(scr, 240));
      const c = document.createElement('div'); c.className = 'cap'; c.textContent = `${cap} (${t})`; el.append(c); row.append(el);
      if (t === 'light') {
        const z = document.createElement('div'); z.className = 'dev'; z.append(dev.crop(scr, [0, 380, 480, 300], 0.75));
        const zc = document.createElement('div'); zc.className = 'cap'; zc.textContent = cap.split(':')[0]; z.append(zc);
        document.getElementById('zoom').append(z);
      }
    }
  }
})();
