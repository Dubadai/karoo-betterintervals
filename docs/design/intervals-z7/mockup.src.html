<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intervals Z7</title>
<style>
@font-face { font-family: Plex; src: url(__FONT_REG__); font-weight: 400; }
@font-face { font-family: Plex; src: url(__FONT_MED__); font-weight: 500; }
@font-face { font-family: Plex; src: url(__FONT_SEMI__); font-weight: 600; }
@font-face { font-family: Plex; src: url(__FONT_BOLD__); font-weight: 700; }
@font-face { font-family: Relative; src: url(__RELATIVE__); }
:root { --bg:#f6f5f2; --fg:#1d1d1b; --muted:#6b6a66; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#161615; --fg:#ecebe7; --muted:#a3a29c; } }
:root[data-theme="dark"] { --bg:#161615; --fg:#ecebe7; --muted:#a3a29c; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 -apple-system, system-ui, sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 64px; }
h1 { font-size: 28px; margin: 0 0 4px; } p { color: var(--muted); max-width: 72ch; }
.flow { display:flex; flex-wrap:wrap; gap: 18px; } .step { flex: 0 1 240px; max-width: 240px; }
.step canvas { display:block; max-width:100%; height:auto; } .step h3 { font-size: 15px; margin: 8px 0 2px; }
</style>
</head>
<body>
<main>
<h1>intervals.icu colours: a better Z7</h1>
<p>The intervals.icu palette's Z7 is a grey now. Options for Z7, on a workout that reaches every
zone, with the graph's +15 % contrast. Light and dark.</p>
<div class="flow">
  <div class="step"><div id="now"></div><h3>Now: grey</h3></div>
  <div class="step"><div id="plum"></div><h3>A: plum</h3></div>
  <div class="step"><div id="magenta"></div><h3>B: magenta</h3></div>
  <div class="step"><div id="indigo"></div><h3>C: indigo</h3></div>
  <div class="step"><div id="ink"></div><h3>D: ink</h3></div>
</div>
</main>
<script>
/*__KAROO_DEVICE_JS__*/
const IMGS = "__IMGS__";
const ICONS = "__ICONS__";
const FRAME_PNG = '__FRAME__';
const HASH = new URLSearchParams(location.hash.slice(1));
const SHOT = HASH.get('shot'), THEME = HASH.get('theme') || 'light';
const FRAME = +(HASH.get('frame') || 0), FRAMES = +(HASH.get('frames') || 1);
const W = SHOT ? 1100 : 240;
const BACKDROP = THEME === 'dark' ? 'linear-gradient(#120E0B,#3F342E)' : 'linear-gradient(#7E9CB4,#F1F4F6)';   // Night / Sky
/*__KIT_JS__*/
(async () => {
  await Promise.all([400, 500, 600, 700].map(w => document.fonts.load(`${w} 20px Plex`))); await document.fonts.load('20px Relative');
  const I = {}; for (const k of Object.keys(IMGS)) I[k] = await loadImg(IMGS[k]);
  const dev = await KarooDevice.load({ frame: FRAME_PNG, screen: IMGS.status });
  const put = (id, draw) => { if (SHOT && id !== SHOT) return;
    const cv = dev.device(dev.screen({ draw: c => draw(c, 0) }), W);
    if (SHOT) { document.body.innerHTML = ''; document.body.style.cssText = `margin:0;background:${BACKDROP};width:1300px;height:2000px;display:flex;align-items:center;justify-content:center`;
      cv.style.width = '1100px'; document.body.append(cv); } else document.getElementById(id).append(cv); };

  // Karoo zone colours (the default palette) with the chart's +15 % contrast (ZonePalette.boosted)
  const NIGHT = THEME === 'dark';
  const FILL = NIGHT ? ['#458376', '#458234', '#BFA34B', '#BC773C', '#A6374E', '#5D41A5'] : ['#8FC4B6', '#8FC380', '#FAE191', '#F7BA86', '#E38395', '#B6A3E6'];
  const EDGE = NIGHT ? ['#52A590', '#52A438', '#F2CE57', '#E28F48', '#D0415A', '#714FC9'] : ['#5CAD98', '#5CAC43', '#F9D660', '#F49D4E', '#D84B64', '#7A58D1'];
  // Z7 options: [fill light, fill dark, edge light, edge dark]
  const Z7 = { now: ['#8C8C8C', '#4A4A4A', '#5E5E5E', '#6E6E6E'], plum: ['#A15C9E', '#6E2A6B', '#7A2F77', '#9C4A98'],
    magenta: ['#E58FD0', '#A3368A', '#CC4FAE', '#C64FA9'], indigo: ['#5E5BA8', '#3B3A8F', '#3B3887', '#5F5DC0'],
    ink: ['#4A4A55', '#C9C9D2', '#202028', '#EDEDF2'] };
  const LABEL = { now: 'Now: grey', plum: 'A: plum', magenta: 'B: magenta', indigo: 'C: indigo', ink: 'D: ink' };
  let ZONES = [], EDGES = [];
  const usePalette = o => { const z = Z7[o]; ZONES = [...FILL, NIGHT ? z[1] : z[0]].map(boost); EDGES = [...EDGE, NIGHT ? z[3] : z[2]].map(boost); };
  // ZonePalette.boosted at +15 %: saturation x1.225; value x0.88 on light, x1.09 on dark
  function boost(hex) { let [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255);
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn; let h = 0;
    if (d) h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; if (h < 0) h += 6;
    let s = mx ? d / mx : 0, v = mx; const a = 0.15; s = Math.min(1, s * (1 + 1.5 * a)); v = Math.min(1, v * (NIGHT ? 1 + 0.6 * a : 1 - 0.8 * a));
    const f = n => { const k = (n + h) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
    return `rgb(${[f(5), f(3), f(1)].map(x => Math.round(x * 255)).join(',')})`; }
  const FTP = 280, LIMITS = [0.55, 0.75, 0.90, 1.05, 1.20, 1.50];
  const zoneOf = w => { const p = w / FTP; const i = LIMITS.findIndex(l => p <= l); return i < 0 ? 6 : i; };

  // W3.1 - Tempo 3 x 15: 20 min warm-up ramp, 3 × (15 min tempo, 5 min easy), 45 min endurance, 15 min cool-down
  const E = [180, 140, 140, 'Easy'];
  const STEPS = [[600, 120, 200, 'Warm-up'], [480, 240, 240, 'Tempo'], E, [360, 285, 285, 'Threshold'], E,
    ...[1, 2, 3].flatMap(() => [[180, 315, 315, 'VO2 max'], E]), ...[1, 2, 3].flatMap(() => [[60, 380, 380, 'Anaerobic'], [120, 140, 140, 'Easy']]),
    ...[1, 2, 3, 4].flatMap(() => [[45, 520, 520, 'Sprint'], [135, 140, 140, 'Easy']]), [600, 150, 110, 'Cool-down']];
  const TOTAL = STEPS.reduce((a, s) => a + s[0], 0);

  function chart(c, x, y, w, h) {
    const max = 560, raw = STEPS.map(([d]) => Math.max(18, d * w / TOTAL)), k = w / raw.reduce((a, b) => a + b, 0); let xx = x;
    STEPS.forEach(([d, a, b], i) => { const x0 = xx, x1 = xx + raw[i] * k - 2, ya = y + h - h * a / max, yb = y + h - h * b / max;
      const fill = (arr) => { if (a === b) return arr[zoneOf(a)]; const g = c.createLinearGradient(x0, 0, x1, 0); g.addColorStop(0, arr[zoneOf(a)]); g.addColorStop(1, arr[zoneOf(b)]); return g; };
      c.beginPath(); c.moveTo(x0, y + h); c.lineTo(x0, ya); c.lineTo(x1, yb); c.lineTo(x1, y + h); c.closePath();
      c.fillStyle = fill(ZONES); c.fill(); c.save(); c.clip(); c.strokeStyle = fill(EDGES); c.lineWidth = 5; c.stroke(); c.restore(); xx += raw[i] * k; });
    const fy = y + h - h * FTP / max; c.save(); c.strokeStyle = C.help; c.lineWidth = 2; c.setLineDash([6, 6]);
    c.beginPath(); c.moveTo(x, fy); c.lineTo(x + w, fy); c.stroke(); c.restore();
    c.fillStyle = C.help; c.font = F(500, 11 * D); c.textAlign = 'right'; c.fillText(`FTP ${FTP} W`, x + w, fy - 8); c.textAlign = 'left';
  }
  const clock = s => { const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
    return h ? `${h}:${String(m).padStart(2, '0')}:${String(ss).padStart(2, '0')}` : `${m}:${String(ss).padStart(2, '0')}`; };

  // Time in zones from the steps (ramps split second by second)
  const inZone = Array(7).fill(0); STEPS.forEach(([d, a, b]) => { for (let i = 0; i < d; i++) inZone[zoneOf(a + (b - a) * (i + 0.5) / d)]++; });

  // ---- Page pieces ----
  const titleBlock = { h: 150, draw(c, y) { c.fillStyle = C.text; c.font = F(700, 22 * D); c.fillText('Sprint mix', X0, y + 56);
    c.fillStyle = C.help; c.font = F(400, 13 * D); c.fillText(`Sat 14 Nov · 1:20:00 · Z7 ${LABEL[OPT]}`, X0, y + 104); } };
  const chartBlock = { h: 210, draw(c, y) { chart(c, X0, y + 16, XW, 170); } };
  const STATS = [['TIME', '2h20'], ['TSS', '108'], ['IF', '0.68'], ['AVG POWER', '180'], ['NP', '191'], ['CALORIES', '1510']];
  const statGrid = { h: 2 * 112 + 12 + 28, draw(c, y) { const g = 12, w = (XW - 2 * g) / 3, h = 112;
    let fp = 50; c.font = `${fp}px Relative`; while (Math.max(...STATS.map(([, v]) => c.measureText(v).width)) > w - 30) { fp--; c.font = `${fp}px Relative`; }
    STATS.forEach(([l, v], i) => { const x = X0 + (i % 3) * (w + g), ty = y + 8 + Math.floor(i / 3) * (h + g);
      c.fillStyle = C.track; c.beginPath(); c.roundRect(x, ty, w, h, 18); c.fill();
      c.fillStyle = C.help; c.font = F(500, 11 * D); c.fillText(l, x + 16, ty + 38);
      c.fillStyle = C.text; c.font = `${fp}px Relative`;
      c.fillText(v, x + 16, ty + 94); }); } };
  const NOTES = 'Steady tempo, smooth pedalling. Stay seated on the efforts, 85–95 rpm. The endurance block is ' +
    'easy: talk-pace. Eat something every 20 minutes and drink to thirst.';
  const notes = (() => { const lines = wrap(M, NOTES, F(400, 15 * D), XW); return { h: lines.length * 40 + 28, draw(c, y) {
    c.fillStyle = C.text; c.font = F(400, 15 * D); lines.forEach((l, i) => c.fillText(l, X0, y + 30 + i * 40)); } }; })();
  const NAMES = ['Recovery', 'Endurance', 'Tempo', 'Threshold', 'VO2 max', 'Anaerobic', 'Sprint'];
  const range = i => { const lo = i ? Math.round(LIMITS[i - 1] * FTP) + 1 : 0, hi = i < 6 ? Math.round(LIMITS[i] * FTP) : null;
    return hi === null ? `${lo}+ W` : i === 0 ? `< ${hi + 1} W` : `${lo}–${hi} W`; };
  const zoneRow = i => ({ h: 100, draw(c, y) { const on = inZone[i] > 0;
    c.globalAlpha = on ? 1 : 0.5;
    c.fillStyle = C.text; c.font = F(600, 15 * D); c.fillText(`Z${i + 1}`, X0, y + 34);
    c.font = F(400, 15 * D); c.fillText(NAMES[i], X0 + 58, y + 34);
    c.font = F(500, 15 * D); c.textAlign = 'right';
    c.fillText(on ? `${clock(inZone[i])} · ${Math.round(100 * inZone[i] / TOTAL)} %` : '–', XR, y + 34);
    c.fillStyle = C.help; c.font = F(400, 12 * D); c.fillText(range(i), XR, y + 80); c.textAlign = 'left';
    const bw = XW - 140; c.fillStyle = C.track; c.beginPath(); c.roundRect(X0, y + 58, bw, 16, 8); c.fill();
    if (on) { c.fillStyle = ZONES[i]; c.beginPath(); c.roundRect(X0, y + 58, Math.max(16, bw * inZone[i] / Math.max(...inZone)), 16, 8); c.fill(); c.strokeStyle = EDGES[i]; c.lineWidth = 2.5; c.stroke(); }
    c.globalAlpha = 1; } });
  // One interval: a zone-coloured strip, its time and name, watts on the right, % FTP and zone under it
  const stepRow = ([d, a, b, name], indent = 0) => ({ h: 100, draw(c, y) { const x = X0 + indent;
    if (a !== b) { const g = c.createLinearGradient(0, y + 14, 0, y + 86); g.addColorStop(0, ZONES[zoneOf(b)]); g.addColorStop(1, ZONES[zoneOf(a)]); c.fillStyle = g; }
    else c.fillStyle = ZONES[zoneOf(a)];
    c.beginPath(); c.roundRect(x, y + 14, 10, 72, 5); c.fill();
    c.fillStyle = C.text; c.font = F(500, 16 * D); c.fillText(name, x + 28, y + 44);
    c.font = F(600, 16 * D); c.textAlign = 'right'; c.fillText(clock(d), XR, y + 44); c.textAlign = 'left';
    const pct = w => Math.round(100 * w / FTP), za = zoneOf(a) + 1, zb = zoneOf(b) + 1;
    const watts = a === b ? `${a} W` : `${a} → ${b} W`;
    c.font = F(600, 14 * D); c.fillText(watts, x + 28, y + 82); const ww = c.measureText(watts).width;
    c.fillStyle = C.help; c.font = F(400, 13 * D);
    c.fillText((a === b ? `${pct(a)} % FTP` : `${pct(a)}–${pct(b)} % FTP`) + ` · ${za === zb ? 'Z' + za : 'Z' + Math.min(za, zb) + '–' + Math.max(za, zb)}`, x + 28 + ww + 16, y + 82); } });
  const repeat = (n, rows) => { const inner = rows.map(r => stepRow(r, 28)); return { h: 60 + inner.reduce((a, r) => a + r.h, 0) + 8, draw(c, y) {
    c.fillStyle = C.text; c.font = F(600, 16 * D); c.fillText(`${n} ×`, X0, y + 42);
    c.fillStyle = C.div; c.fillRect(X0 + 8, y + 60, 3, inner.reduce((a, r) => a + r.h, 0) - 8);
    let yy = y + 60; inner.forEach(r => { r.draw(c, yy); yy += r.h; }); } }; };

  const strip = { h: 130, draw(c, y) { const g = 8, w = (XW - 6 * g) / 7;
    ZONES.forEach((z, i) => { const x = X0 + i * (w + g); c.fillStyle = z; c.beginPath(); c.roundRect(x, y + 12, w, 66, 12); c.fill();
      c.strokeStyle = EDGES[i]; c.lineWidth = 4; c.stroke(); c.fillStyle = C.text; c.font = F(600, 13 * D); c.textAlign = 'center'; c.fillText(`Z${i + 1}`, x + w / 2, y + 112); c.textAlign = 'left'; }); } };
  const form = layout([titleBlock, { h: 300, draw(c, y) { chart(c, X0, y + 16, XW, 260); } }, strip, heading('colours', 'Time in zones'), ...[0, 1, 2, 3, 4, 5, 6].map(zoneRow), space(16)]);
  // The page: ← on the left, Select workout (the page's one yellow button) on the right of the bar
  function detailsPage(c, from) {
    c.fillStyle = C.bg; c.fillRect(0, 50, 480, 750); if (NIGHT) statusBar(c);
    clipForm(c, form, 146, from);
    c.fillStyle = C.bg; c.fillRect(0, 50, 480, 96);
    icon(c, 'back', 30, 83, 45);
    c.font = F(600, 15 * D); const tw = c.measureText('Select workout').width, pw = tw + 2 * 18 * D, ph = 38 * D, px = XR - pw, py = 98 - ph / 2;
    c.fillStyle = C.yellow; c.beginPath(); c.roundRect(px, py, pw, ph, ph / 2); c.fill();
    c.fillStyle = C.mainText; c.textAlign = 'center'; c.fillText('Select workout', px + pw / 2, py + ph / 2 + 10); c.textAlign = 'left';
  }
  let OPT = 'now';
  ['now', 'plum', 'magenta', 'indigo', 'ink'].forEach(o => put(o, c => { OPT = o; usePalette(o); detailsPage(c, 0); }));
})();
</script>
</body>
</html>
