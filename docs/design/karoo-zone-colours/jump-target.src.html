<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jump target look</title>
<style>
  :root { color-scheme: dark; }
  body { background:#2A2A2A; color:#E8E6E1; font:14px/1.45 -apple-system, "Helvetica Neue", Arial, sans-serif; margin:0; padding:28px 16px; }
  h1 { font-size:18px; font-weight:500; margin:0 0 4px; text-align:center; }
  p.d { color:#A9A6A0; margin:0 auto 22px; max-width:780px; text-align:center; }
  .devices { display:flex; flex-wrap:wrap; justify-content:center; gap:26px; margin-bottom:30px; }
  .dev { display:grid; justify-items:center; gap:8px; }
  .cap { color:#A9A6A0; font-size:13px; max-width:260px; text-align:center; }
</style>
</head>
<body>
<h1>Jump target with Karoo zone colours</h1>
<p class="d">Today the step a jump lands on is filled solid blue (purple with Karoo style), which would look like Karoo Z2 (Z7). Here the target is the Z4 step two ahead, with its ▼; the current step has the 1dp gap. Karoo style, as on these screens.</p>
<div class="devices" id="light"></div>
<div class="devices" id="dark"></div>
<div class="devices" id="lightz"></div>
<div class="devices" id="darkz"></div>
<script>/*__KAROO_DEVICE_JS__*/</script>
<script>
const FRAME = "__FRAME__";
const BASE = { light: "__screen_light__", dark: "__screen_dark__" };
const NOW = {
  light: { z: ['#1D9E75', '#639922', '#BA7517', '#D85A30', '#E24B4A'], done: '#888780', bg: '#FFFFFF' },
  dark:  { z: ['#1D9E75', '#639922', '#EF9F27', '#D85A30', '#E24B4A'], done: '#888780', bg: '#000000' },
};
const KAROO = {
  light: ['#8F8D86', '#2F7FD8', '#3FA34D', '#E8B400', '#F07A1A', '#E0383E', '#8B4FD8'],
  dark:  ['#A6A49C', '#4C9BF0', '#5CC46A', '#FFD02E', '#FF9440', '#FF5A5F', '#A97AF2'],
};
const DONE_STEPS = [[16, 64, 0], [65, 87, 2]];
// Current step on the screenshot (px): outline box x 88–115, y 705–750 (stroke ≈3.75 px = 2dp);
// the fill inside it runs x 92–111, y 708–747. 1dp = 1.875 px on the Karoo 3.
const INNER = [92, 708, 20, 40];
const DP = 1.875;

const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function recolour(pairs, bgHex, y0) {
  const bg = hex(bgHex), P = pairs.map(([f, t, x0 = 0, x1 = 479]) => [hex(f), hex(t), x0, x1]);
  return ctx => {
    const img = ctx.getImageData(0, 0, 480, 800), d = img.data;
    for (let i = y0 * 480 * 4; i < d.length; i += 4) {
      const p = [d[i], d[i + 1], d[i + 2]], x = (i / 4) % 480;
      for (const [f, t, x0, x1] of P) {
        if (x < x0 || x > x1) continue;
        const v = f.map((c, k) => c - bg[k]), len2 = v.reduce((s, c) => s + c * c, 0);
        if (!len2) continue;
        const a = p.reduce((s, c, k) => s + (c - bg[k]) * v[k], 0) / len2;
        if (a < 0.2 || a > 1.05) continue;
        const res = p.reduce((s, c, k) => s + Math.abs(c - (bg[k] + a * v[k])), 0);
        if (res > 18) continue;
        for (let k = 0; k < 3; k++) d[i + k] = Math.round(bg[k] + Math.min(a, 1) * (t[k] - bg[k]));
        break;
      }
    }
    ctx.putImageData(img, 0, 0);
  };
}


// Target bar on the screenshot (Z4, two steps ahead): x 142–163, y 718–749; ▼ 10dp wide just above.
const TARGET = [142, 718, 22, 31];
const PURPLE = { light: '#590D80', dark: '#EABFFF' };      // karoo_purple, today's Karoo-style target
const INK = { light: '#0B0B0B', dark: '#FFFFFF' };

function base(theme, ctx) {
  const n = NOW[theme], k = KAROO[theme];
  recolour([...n.z.map((c, i) => [c, k[i]]), ...DONE_STEPS.map(([x0, x1, z]) => [n.done, k[z], x0, x1])], n.bg, 640)(ctx);
  // Current step: 1dp gap (built).
  const g = DP, [x, y, w, h] = INNER;
  ctx.fillStyle = n.bg; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = k[4]; ctx.fillRect(x + g, y + g, w - 2 * g, h - g);
  ctx.fillStyle = INK[theme]; ctx.fillRect(109, y, 1.6, h);
}

function target(theme, look) {
  return ctx => {
    base(theme, ctx);
    const [x, y, w, h] = TARGET, ink = INK[theme], zone = KAROO[theme][3], bg = NOW[theme].bg;
    ctx.save();
    if (look === 'now') { ctx.fillStyle = PURPLE[theme]; ctx.fillRect(x, y, w, h); }
    if (look === 'ink') { ctx.fillStyle = ink; ctx.fillRect(x, y, w, h); }
    if (look === 'stripes') {
      ctx.fillStyle = zone; ctx.fillRect(x, y, w, h);
      ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
      ctx.strokeStyle = ink; ctx.lineWidth = 1.5 * DP;
      for (let s = -h; s < w + h; s += 4 * DP) { ctx.beginPath(); ctx.moveTo(x + s, y + h); ctx.lineTo(x + s + h, y); ctx.stroke(); }
    }
    if (look === 'dashed') {
      ctx.fillStyle = bg; ctx.fillRect(x - 1, y - 1, w + 2, h + 1);
      ctx.fillStyle = zone; ctx.fillRect(x + 2 * DP, y + 2 * DP, w - 4 * DP, h - 2 * DP);
      ctx.strokeStyle = ink; ctx.lineWidth = 2 * DP; ctx.setLineDash([3 * DP, 2 * DP]);
      ctx.strokeRect(x + DP, y + DP, w - 2 * DP, h - DP);
    }
    ctx.restore();
    // ▼ above the target, as today
    const cx = x + w / 2; ctx.fillStyle = ink;
    ctx.beginPath(); ctx.moveTo(cx - 5 * DP, y - 8 * DP); ctx.lineTo(cx + 5 * DP, y - 8 * DP); ctx.lineTo(cx, y - 2 * DP); ctx.closePath(); ctx.fill();
  };
}

const VARIANTS = [
  ['Now: solid purple (Karoo style), like Z7', 'now'],
  ['A · Solid black / white', 'ink'],
  ['B · Zone colour with stripes', 'stripes'],
  ['C · Zone colour, dashed outline', 'dashed'],
];

(async () => {
  for (const t of ['light', 'dark']) {
    const dev = await KarooDevice.load({ frame: FRAME, screen: BASE[t] });
    for (const [cap, look] of VARIANTS) {
      const scr = dev.screen({ draw: target(t, look) });
      const el = document.createElement('div'); el.className = 'dev'; el.append(dev.device(scr, 200));
      const c = document.createElement('div'); c.className = 'cap'; c.textContent = `${cap} (${t})`; el.append(c);
      document.getElementById(t).append(el);
      const z = document.createElement('div'); z.className = 'dev'; z.append(dev.crop(scr, [40, 670, 200, 90], 1.2));
      const zc = document.createElement('div'); zc.className = 'cap'; zc.textContent = `${cap.split(':')[0].split(',')[0]} (${t}), close-up`; z.append(zc);
      document.getElementById(t + 'z').append(z);
    }
  }
})();
</script>
</body>
</html>
